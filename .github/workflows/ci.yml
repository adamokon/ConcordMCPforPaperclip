name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --extra dev --locked
      - run: node --check scripts/native-recovery-backend.mjs
      - run: node --check scripts/native-partial-backend.mjs
      - run: uv run ruff check src tests
      - run: uv run pytest -q
      - run: uv run python -m unittest discover -s examples/codex-e2e -v
      - run: uv run python examples/codex-e2e/operator_acceptance.py
      - run: uv run python -m unittest discover -s examples/codex-unattended -v
      - run: uv run python -m unittest discover -s examples/cross-harness-cooperation -v
      - run: uv run python scripts/check_public_tree.py
      - run: uv build
