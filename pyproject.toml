[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "concord-mcp-for-paperclip"
version = "0.2.1"
description = "Durable Paperclip task coordination and an optional real Concord MCP projection"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp==1.30.0"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.0"]

[project.scripts]
paperclip-bridge = "concord_paperclip.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/concord_paperclip"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/examples", "/docs", "/README.md", "/LICENSE",
           "/pyproject.toml", "/uv.lock", "/.github", "/AGENTS.md", "/.gitignore"]
exclude = ["**/__pycache__", "**/*.pyc", "/site-private", "/.venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
